<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartLocal</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme Script -->
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- Global Error Alert -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-octagon-fill"></i>
                    <span th:text="${errorMessage}">Registration error</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Registration Card -->
                <div class="card smart-card border rounded-4 shadow-sm p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                            <i class="bi bi-person-plus-fill fs-4"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Create an account</h4>
                        <p class="text-muted small mb-0">Join SmartLocal to explore or register local stores</p>
                    </div>

                    <form th:action="@{/register}" th:object="${userDto}" method="post" novalidate>
                        
                        <!-- Role Selection -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary d-block">Account Type</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="roleCustomer" value="CUSTOMER" 
                                           th:field="*{role}" th:checked="*{role == null or role == 'CUSTOMER'}">
                                    <label class="btn btn-outline-primary w-100 py-2 text-center rounded-3 fw-medium" for="roleCustomer">
                                        <i class="bi bi-person me-1"></i> Customer
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="roleRetailer" value="RETAILER" 
                                           th:field="*{role}">
                                    <label class="btn btn-outline-primary w-100 py-2 text-center rounded-3 fw-medium" for="roleRetailer">
                                        <i class="bi bi-shop me-1"></i> Retailer
                                    </label>
                                </div>
                            </div>
                            <div th:if="${#fields.hasErrors('role')}" class="text-danger small mt-1">
                                <span th:errors="*{role}"></span>
                            </div>
                        </div>

                        <!-- Name -->
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small text-secondary">Full Name</label>
                            <input type="text" id="fullName" th:field="*{fullName}" 
                                   class="form-control" 
                                   th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''"
                                   placeholder="Full name" required>
                            <div th:if="${#fields.hasErrors('fullName')}" class="text-danger small mt-1" th:errors="*{fullName}"></div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-secondary">Email Address</label>
                            <input type="email" id="email" th:field="*{email}" 
                                   class="form-control" 
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="Email address" required>
                            <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-1" th:errors="*{email}"></div>
                        </div>

                        <!-- Phone -->
                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold small text-secondary">Phone (Optional)</label>
                            <input type="tel" id="phone" th:field="*{phone}" 
                                   class="form-control" 
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''"
                                   placeholder="Phone number">
                            <div th:if="${#fields.hasErrors('phone')}" class="text-danger small mt-1" th:errors="*{phone}"></div>
                        </div>

                        <!-- Passwords -->
                        <div class="row g-2 mb-4">
                            <div class="col-md-6">
                                <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="password" th:field="*{password}" 
                                           class="form-control" 
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''"
                                           placeholder="Password" required>
                                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)" aria-label="Toggle password visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-1" th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label fw-semibold small text-secondary">Confirm Password</label>
                                <div class="password-input-wrapper">
                                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" 
                                           class="form-control" 
                                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid' : ''"
                                           placeholder="Confirm password" required>
                                    <button type="button" class="password-toggle-btn" onclick="togglePassword('confirmPassword', this)" aria-label="Toggle confirm password visibility">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                                <div th:if="${#fields.hasErrors('confirmPassword')}" class="text-danger small mt-1" th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mb-3 shadow-sm">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center small text-muted pt-2 border-top">
                        Already have an account? 
                        <a th:href="@{/login}" class="text-primary fw-semibold text-decoration-none ms-1">Login</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('bi-eye');
                icon.classList.add('bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('bi-eye-slash');
                icon.classList.add('bi-eye');
            }
        }
    </script>
</body>
</html>
