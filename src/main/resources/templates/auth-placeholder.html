<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - SmartLocal</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme Script -->
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Header Navigation -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5 my-auto text-center">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card smart-card border-0 shadow-sm p-4 p-md-5 text-center">
                    <div class="rounded-circle bg-primary bg-opacity-10 text-primary mx-auto p-3 mb-3 d-inline-flex">
                        <i class="bi bi-shield-lock fs-2"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Access Portal</h4>
                    <p class="text-muted small mb-4">Please log in to continue.</p>

                    <div class="d-flex justify-content-center gap-2">
                        <a th:href="@{/login}" class="btn btn-primary rounded-pill px-4 fw-semibold">
                            Login
                        </a>
                        <a th:href="@{/}" class="btn btn-outline-secondary rounded-pill px-4">
                            Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
