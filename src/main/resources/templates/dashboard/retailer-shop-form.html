<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shop - SmartLocal</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme Script -->
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4 my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Back Navigation -->
                <div class="mb-3">
                    <a th:href="@{/retailer/dashboard}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>

                <!-- Global Error Alert -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}">Error occurred</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Form Card -->
                <div class="card smart-card border rounded-4 shadow-sm p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="rounded-circle bg-success bg-opacity-10 text-success p-3">
                            <i class="bi bi-pencil fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark">Edit Shop</h4>
                        </div>
                    </div>

                    <form th:action="@{/retailer/shop/save}" th:object="${shopDto}" method="post">
                        <!-- Hidden ID to preserve ownership & update record -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <!-- Shop Name -->
                            <div class="col-md-6">
                                <label for="shopName" class="form-label small fw-semibold text-secondary">Shop Name *</label>
                                <input type="text" id="shopName" th:field="*{shopName}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('shopName')} ? 'is-invalid' : ''"
                                       placeholder="Shop name" required>
                                <div th:if="${#fields.hasErrors('shopName')}" class="text-danger small mt-1" th:errors="*{shopName}"></div>
                            </div>

                            <!-- Owner Name -->
                            <div class="col-md-6">
                                <label for="ownerName" class="form-label small fw-semibold text-secondary">Owner Name *</label>
                                <input type="text" id="ownerName" th:field="*{ownerName}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('ownerName')} ? 'is-invalid' : ''"
                                       placeholder="Owner name" required>
                                <div th:if="${#fields.hasErrors('ownerName')}" class="text-danger small mt-1" th:errors="*{ownerName}"></div>
                            </div>

                            <!-- Contact Number -->
                            <div class="col-md-6">
                                <label for="contactNumber" class="form-label small fw-semibold text-secondary">Phone *</label>
                                <input type="tel" id="contactNumber" th:field="*{contactNumber}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid' : ''"
                                       placeholder="Phone" required>
                                <div th:if="${#fields.hasErrors('contactNumber')}" class="text-danger small mt-1" th:errors="*{contactNumber}"></div>
                            </div>

                            <!-- Category -->
                            <div class="col-md-6">
                                <label for="category" class="form-label small fw-semibold text-secondary">Category *</label>
                                <select id="category" th:field="*{category}" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                                </select>
                            </div>

                            <!-- Area Choice -->
                            <div class="col-md-6">
                                <label for="locationId" class="form-label small fw-semibold text-secondary">Zone *</label>
                                <select id="locationId" th:field="*{locationId}" class="form-select" required>
                                    <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name}">Location</option>
                                </select>
                            </div>

                            <!-- Opening Hours -->
                            <div class="col-md-6">
                                <label for="openingHours" class="form-label small fw-semibold text-secondary">Hours</label>
                                <input type="text" id="openingHours" th:field="*{openingHours}" class="form-control" 
                                       placeholder="e.g. 09:00 AM - 09:30 PM">
                            </div>

                            <!-- Physical Address -->
                            <div class="col-12">
                                <label for="address" class="form-label small fw-semibold text-secondary">Address *</label>
                                <input type="text" id="address" th:field="*{address}" 
                                       class="form-control" 
                                       th:classappend="${#fields.hasErrors('address')} ? 'is-invalid' : ''"
                                       placeholder="Address" required>
                                <div th:if="${#fields.hasErrors('address')}" class="text-danger small mt-1" th:errors="*{address}"></div>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label for="description" class="form-label small fw-semibold text-secondary">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3" 
                                          placeholder="Description"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a th:href="@{/retailer/dashboard}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">
                                Save Changes
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
