<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Product - SmartLocal' : 'Add Product - SmartLocal'">Product - SmartLocal</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme Script -->
    <script th:src="@{/js/theme.js}"></script>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-4 my-auto">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- Back Navigation -->
                <div class="mb-3">
                    <a th:href="@{/retailer/inventory}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>

                <!-- Error Alert -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}">Error occurred</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- Form Card -->
                <div class="card smart-card border rounded-4 shadow-sm p-4 p-md-5 bg-white">
                    <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                        <div class="rounded-circle bg-primary bg-opacity-10 text-primary p-3">
                            <i class="bi" th:classappend="${isEdit} ? 'bi-pencil fs-3' : 'bi-plus-lg fs-3'"></i>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-0 text-dark" th:text="${isEdit} ? 'Edit Product' : 'Add Product'">Add Product</h4>
                        </div>
                    </div>

                    <form th:action="@{/retailer/inventory/save}" th:object="${productDto}" method="post">
                        <!-- Hidden ID if editing -->
                        <input type="hidden" th:field="*{id}">

                        <div class="row g-3">
                            <!-- Product Name -->
                            <div class="col-md-8">
                                <label for="name" class="form-label small fw-semibold text-secondary">Product Name *</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control"
                                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                       placeholder="Product name" required>
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1" th:errors="*{name}"></div>
                            </div>

                            <!-- SKU -->
                            <div class="col-md-4">
                                <label for="sku" class="form-label small fw-semibold text-secondary">SKU</label>
                                <input type="text" id="sku" th:field="*{sku}" class="form-control"
                                       placeholder="SKU">
                            </div>

                            <!-- Category -->
                            <div class="col-md-6">
                                <label for="category" class="form-label small fw-semibold text-secondary">Category *</label>
                                <select id="category" th:field="*{category}" class="form-select" required>
                                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">Category</option>
                                </select>
                            </div>

                            <!-- Unit -->
                            <div class="col-md-6">
                                <label for="unit" class="form-label small fw-semibold text-secondary">Unit</label>
                                <input type="text" id="unit" th:field="*{unit}" class="form-control"
                                       placeholder="Unit (e.g. pcs, kg)">
                            </div>

                            <!-- Price -->
                            <div class="col-md-6">
                                <label for="price" class="form-label small fw-semibold text-secondary">Price (&#8377;) *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted">&#8377;</span>
                                    <input type="number" id="price" th:field="*{price}" step="0.01" min="0"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''"
                                           placeholder="Price" required>
                                </div>
                                <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1" th:errors="*{price}"></div>
                            </div>

                            <!-- Original Price -->
                            <div class="col-md-6">
                                <label for="originalPrice" class="form-label small fw-semibold text-secondary">MRP (&#8377;)</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-muted">&#8377;</span>
                                    <input type="number" id="originalPrice" th:field="*{originalPrice}" step="0.01" min="0"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('originalPrice')} ? 'is-invalid' : ''"
                                           placeholder="MRP">
                                </div>
                                <div th:if="${#fields.hasErrors('originalPrice')}" class="text-danger small mt-1" th:errors="*{originalPrice}"></div>
                            </div>

                            <!-- Quantity -->
                            <div class="col-md-6">
                                <label for="quantity" class="form-label small fw-semibold text-secondary">Quantity *</label>
                                <input type="number" id="quantity" th:field="*{quantity}" min="0"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid' : ''"
                                       placeholder="Quantity" required>
                                <div th:if="${#fields.hasErrors('quantity')}" class="text-danger small mt-1" th:errors="*{quantity}"></div>
                            </div>

                            <!-- Threshold -->
                            <div class="col-md-6">
                                <label for="lowStockThreshold" class="form-label small fw-semibold text-secondary">Low Stock Alert *</label>
                                <input type="number" id="lowStockThreshold" th:field="*{lowStockThreshold}" min="0"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('lowStockThreshold')} ? 'is-invalid' : ''"
                                       placeholder="Threshold" required>
                                <div th:if="${#fields.hasErrors('lowStockThreshold')}" class="text-danger small mt-1" th:errors="*{lowStockThreshold}"></div>
                            </div>

                            <!-- Description -->
                            <div class="col-12">
                                <label for="description" class="form-label small fw-semibold text-secondary">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Description"></textarea>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a th:href="@{/retailer/inventory}" class="btn btn-outline-secondary rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm">
                                <span th:text="${isEdit} ? 'Save Changes' : 'Add Product'">Save</span>
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
