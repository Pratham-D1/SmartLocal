<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email OTP - SmartLocal</title>
    <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Theme Script -->
    <script th:src="@{/js/theme.js}"></script>
    <style>
        .otp-input {
            letter-spacing: 0.6rem;
            font-size: 1.85rem;
            font-weight: 700;
            text-align: center;
            border-radius: var(--radius-md);
            padding: 0.6rem;
            background-color: var(--bg-page);
        }
        .otp-input:focus {
            background-color: #ffffff;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navigation Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorMessage}">Invalid or expired OTP</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 mb-3 shadow-sm" role="alert">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${successMessage}">OTP sent</span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>

                <!-- OTP Verification Card -->
                <div class="card smart-card border rounded-4 shadow-sm p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 48px; height: 48px;">
                            <i class="bi bi-shield-lock-fill fs-4"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-1">Verify Email</h4>
                        <p class="text-muted small mb-0">Enter the 6-digit code sent to</p>
                        <strong class="text-dark d-block mt-1 small" th:text="${email}">user@example.com</strong>
                    </div>

                    <!-- Verification Form -->
                    <form th:action="@{/verify-otp}" method="post" id="otpForm">
                        <input type="hidden" name="email" th:value="${email}">

                        <div class="mb-4">
                            <label for="otpInput" class="form-label fw-semibold small text-secondary text-center d-block">
                                6-Digit Code
                            </label>
                            <input type="text" id="otpInput" name="otp" 
                                   class="form-control otp-input" 
                                   placeholder="------" 
                                   maxlength="6" 
                                   pattern="[0-9]{6}" 
                                   inputmode="numeric" 
                                   autocomplete="one-time-code" 
                                   required autofocus>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill mb-3 shadow-sm">
                            Verify OTP
                        </button>
                    </form>

                    <!-- Resend OTP Form -->
                    <div class="d-flex justify-content-between align-items-center pt-3 border-top small text-muted">
                        <span>Didn't get code?</span>
                        <form th:action="@{/resend-otp}" method="post" id="resendForm" class="d-inline m-0">
                            <input type="hidden" name="email" th:value="${email}">
                            <button type="submit" id="resendBtn" class="btn btn-link text-primary p-0 small fw-semibold text-decoration-none">
                                <span id="resendText">Resend OTP</span>
                            </button>
                        </form>
                    </div>

                    <div class="text-center pt-3 mt-2 border-top small text-muted">
                        <a th:href="@{/register}" class="text-muted text-decoration-none">Change email</a>
                        <span class="mx-2">&bull;</span>
                        <a th:href="@{/login}" class="text-primary fw-medium text-decoration-none">Login</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        /* Cooldown countdown timer */
        let secondsLeft = /*[[${cooldownSeconds != null ? cooldownSeconds : 0}]]*/ 0;
        const resendBtn = document.getElementById('resendBtn');
        const resendText = document.getElementById('resendText');

        function updateResendState() {
            if (secondsLeft > 0) {
                resendBtn.disabled = true;
                resendBtn.classList.remove('text-primary');
                resendBtn.classList.add('text-muted');
                resendText.textContent = 'Resend OTP (' + secondsLeft + 's)';
                secondsLeft--;
                setTimeout(updateResendState, 1000);
            } else {
                resendBtn.disabled = false;
                resendBtn.classList.remove('text-muted');
                resendBtn.classList.add('text-primary');
                resendText.textContent = 'Resend OTP';
            }
        }

        if (secondsLeft > 0) {
            updateResendState();
        }
    </script>
</body>
</html>
