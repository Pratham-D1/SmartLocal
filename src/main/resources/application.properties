# ========================================================
# SmartLocal - Hyperlocal Retail & Discovery System
# ========================================================
spring.application.name=smartlocal
server.port=8080

# Active Profile Configuration
# 'h2' is enabled by default to prevent blocking startup when local MySQL credentials vary.
# To switch to MySQL, change to: spring.profiles.active=mysql (or run with --spring.profiles.active=mysql)
spring.profiles.active=mysql

# Template engine (Thymeleaf) configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static assets mapping
spring.web.resources.static-locations=classpath:/static/

# ========================================================
# Real Email / SMTP Configuration
# Uses environment variables with standard keys
# ========================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@smartlocal.com}
